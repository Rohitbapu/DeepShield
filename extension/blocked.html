<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepShield – Link Blocked</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    p { color: #475569; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
    .url-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 16px 0;
      word-break: break-all;
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-success {
      background: #16a34a;
      color: white;
    }
    .btn-success:hover { background: #15803d; }
    .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .footnote {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
    .success-message {
      color: #16a34a;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Link Blocked</h1>
    <p>DeepShield detected this link as potentially dangerous.</p>
    <div class="url-box" id="blockedUrl">Loading...</div>
    <p style="font-size:13px;color:#64748b;">If you trust this site, you can add it to your safe list.</p>
    <div class="btn-group">
      <button class="btn btn-success" id="addSafeBtn">➕ Add to Safe List</button>
      <button class="btn btn-secondary" id="goBackBtn">← Go Back</button>
    </div>
    <div id="successMessage" class="success-message">✅ Added to Safe List! Reloading page...</div>
    <div class="footnote">DeepShield DLP · Enterprise Protection</div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
