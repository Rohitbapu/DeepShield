<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepShield DLP Controls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 320px;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-group h1 {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            transition: background-color 0.3s ease;
        }

        .dot.online {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .action-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-secondary {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .btn-success {
            background-color: #15803d !important;
            color: #ffffff !important;
            border: none !important;
        }

        .btn-danger {
            background-color: #991b1b !important;
            color: #ffffff !important;
            border: none !important;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-group">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h1>DeepShield DLP</h1>
        </div>
        <div class="status-badge">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Checking...</span>
        </div>
    </div>

    <div class="action-container">
        <button id="activeScanBtn" class="btn btn-primary">
            🔍 Scan This Page
        </button>

        <button id="toggleProtectionBtn" class="btn btn-secondary">
            🛡️ Protection: ON
        </button>

        <button id="allowlistBtn" class="btn btn-secondary">
            + Add Current Site to Safe List
        </button>
    </div>

    <div class="footer">
        DeepShield DLP Engine v5.0 • Powered by Gemini AI
    </div>

    <script src="popup.js"></script>
</body>
</html>
