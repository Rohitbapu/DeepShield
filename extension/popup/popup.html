<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepShield DLP Controls</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-text {
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .brand-text span {
      color: #2563eb;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.3);
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: scale(1.01);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .btn-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .btn-success:hover {
      background: #bbf7d0;
    }
    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .btn-danger:hover {
      background: #fecaca;
    }
    .btn-dashboard {
      background: #f1f5f9;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
    .btn-dashboard:hover {
      background: #bfdbfe;
    }
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 14px 0;
    }
    .badge-legend {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }
    .badge-dot {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
    }
    .badge-dot.critical { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-dot.warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge-dot.safe { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .footer {
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">D</div>
        <span class="brand-text">Deep<span>Shield</span></span>
      </div>
      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Offline</span>
      </div>
    </div>

    <div class="subtitle">Enterprise AI Threat Detector · v5.1</div>

    <!-- Primary Actions -->
    <button class="btn btn-primary" id="activeScanBtn">🔍 Scan This Page</button>

    <!-- Dashboard Link -->
    <button class="btn btn-dashboard" id="dashboardBtn">📊 Open Dashboard</button>

    <!-- Badge Legend -->
    <div class="badge-legend">
      <span class="badge-dot critical">🚨 Critical</span>
      <span class="badge-dot warning">⚠️ Warning</span>
      <span class="badge-dot safe">✅ Safe</span>
    </div>

    <div class="divider"></div>

    <!-- Controls -->
    <button class="btn btn-secondary" id="toggleProtectionBtn">🛡️ Protection: ON</button>
    <button class="btn btn-secondary" id="allowlistBtn">+ Add Current Site to Safe List</button>

    <div class="footer">Powered by Gemini + Groq · v5.1</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
